name: baiseball
region: nyc
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
domains:
  - domain: baiseball.app
    type: PRIMARY
  - domain: api.baiseball.app
    type: ALIAS
ingress:
  rules:
    - component:
        name: api
      match:
        authority:
          exact: api.baiseball.app
        path:
          prefix: /
    - component:
        name: web
      match:
        authority:
          exact: baiseball.app
        path:
          prefix: /
    - component:
        name: web
      match:
        path:
          prefix: /
services:
  - name: api
    github:
      repo: jeremyjbowers/baiseball-app
      branch: main
      deploy_on_push: true
    dockerfile_path: admin-api/Dockerfile
    http_port: 8080
    health_check:
      http_path: /health
      initial_delay_seconds: 15
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 12
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}
      - key: PUBLIC_APP_URL
        scope: RUN_TIME
        value: https://baiseball.app
      - key: OWNER_BOOTSTRAP_EMAIL
        scope: RUN_TIME
        value: jeremyjbowers@gmail.com
static_sites:
  - name: web
    github:
      repo: jeremyjbowers/baiseball-app
      branch: main
      deploy_on_push: true
    source_dir: web
    environment_slug: node-js
    build_command: npm ci && npm run build
    output_dir: dist
    catchall_document: index.html
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: https://api.baiseball.app
databases:
  - name: db
    engine: PG
    version: "16"
    production: true
    cluster_name: baiseball-pg
