name: baiseball
region: nyc
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
domains:
  - domain: league-office.app
    type: PRIMARY
  - domain: api.league-office.app
    type: ALIAS
ingress:
  rules:
    - component:
        name: api
      match:
        authority:
          exact: api.league-office.app
        path:
          prefix: /
    - component:
        name: web
      match:
        authority:
          exact: league-office.app
        path:
          prefix: /
    - component:
        name: web
      match:
        path:
          prefix: /
services:
  - name: api
    git:
      repo_clone_url: https://github.com/jeremyjbowers/baiseball-app.git
      branch: main
    dockerfile_path: admin-api/Dockerfile
    http_port: 8080
    health_check:
      http_path: /health
      initial_delay_seconds: 15
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 12
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}
      - key: PUBLIC_APP_URL
        scope: RUN_TIME
        value: https://league-office.app
      - key: OWNER_BOOTSTRAP_EMAIL
        scope: RUN_TIME
        value: jeremyjbowers@gmail.com
      # App-level production env supplies MAILGUN_API_KEY, MAILGUN_DOMAIN,
      # TWILIO_SID, and TWILIO_CLIENT_SECRET. MAILGUN_FROM and TWILIO_FROM
      # are optional.
static_sites:
  - name: web
    git:
      repo_clone_url: https://github.com/jeremyjbowers/baiseball-app.git
      branch: main
    source_dir: web
    environment_slug: node-js
    build_command: npm ci && npm run build
    output_dir: dist
    catchall_document: index.html
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: https://api.league-office.app
databases:
  - name: db
    engine: PG
    version: "16"
    production: true
    cluster_name: baiseball-pg
