name: baiseball
region: nyc
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
domains:
  - domain: baiseball.app
    type: PRIMARY
    wildcard: true
ingress:
  rules:
    - component:
        name: web
      match:
        authority:
          exact: baiseball.app
        path:
          prefix: /
    - component:
        name: api
      match:
        authority:
          exact: api.baiseball.app
        path:
          prefix: /
services:
  - name: api
    github:
      repo: jeremyjbowers/baiseball-app
      branch: main
      deploy_on_push: true
    dockerfile_path: admin-api/Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: PUBLIC_APP_URL
        scope: RUN_TIME
        value: https://baiseball.app
      - key: OWNER_BOOTSTRAP_EMAIL
        scope: RUN_TIME
        value: jeremyjbowers@gmail.com
      - key: MAILGUN_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: MAILGUN_DOMAIN
        scope: RUN_TIME
      - key: MAILGUN_FROM
        scope: RUN_TIME
      - key: TWILIO_ACCOUNT_SID
        scope: RUN_TIME
        type: SECRET
      - key: TWILIO_AUTH_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: TWILIO_FROM
        scope: RUN_TIME
static_sites:
  - name: web
    github:
      repo: jeremyjbowers/baiseball-app
      branch: main
      deploy_on_push: true
    source_dir: web
    environment_slug: node-js
    build_command: npm ci && npm run build
    output_dir: dist
    catchall_document: index.html
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: https://api.baiseball.app
databases:
  - name: db
    engine: PG
    version: "16"
    production: true
